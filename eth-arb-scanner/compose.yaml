services:
  scanner:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - scanner-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, src/health.js]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
volumes:
  scanner-data:
